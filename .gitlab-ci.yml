stages:
  - lint
  - test
  - coverage

# linter
pylint:
  stage: test
  image: python:latest
  retry: 2
  before_script:
    - mkdir -p public/badges public/lint
    - echo undefined > public/badges/$CI_JOB_NAME.score
    - pip3 install anybadge pylint
    - pip3 install -r backend/requirements.txt
    - git clone https://gitlab.esiea.fr/gauthier.heiss/python-file-scorer.git /opt/python-file-scorer
    - apt update
    - apt install bc -y
  script:
    - /opt/python-file-scorer/score.sh | tee public/lint/lint.txt
    - tail -n 1 public/lint/lint.txt > public/badges/$CI_JOB_NAME.score
  after_script:
    - anybadge --overwrite --label $CI_JOB_NAME --value=$(cat public/badges/$CI_JOB_NAME.score) --file=pylint.svg 4=red 6=orange 8=yellow 10=green
  artifacts:
    paths:
      - public
      - pylint.svg
    when: always

    # Tests unitaires frontend (Vitest)
frontend_tests:
  stage: test
  image: node:20-alpine
  retry: 2
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run test -- --run --reporter=verbose
  artifacts:
    when: always
    paths:
      - frontend/coverage/

frontend_coverage:
  stage: coverage
  image: node:20-alpine
  retry: 2
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run test:coverage -- --run
  coverage: '/^All files\s+\|\s+[\d.]+/'
  artifacts:
    when: always
    paths:
      - frontend/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml

    #exécution des tests
unit_tests:
  stage: test
  image: python:3.13-slim
  retry: 2

  # On lance un service Postgres local
  services:
    - name: postgres:16-alpine
      alias: db-test-local

  variables:
    PYTHONPATH: "backend"
    POSTGRES_DB: test_db
    POSTGRES_USER: user_test
    POSTGRES_PASSWORD: password_test
    POSTGRES_HOST_AUTH_METHOD: trust

  before_script:
    - pip3 install -r backend/requirements.txt
    - pip3 install pytest httpx

  script:
    - export DATABASE_URL="postgresql://user_test:password_test@db-test-local:5432/test_db"
    - cd backend && pytest tests/ -v

  artifacts:
    when: always
    paths:
      - backend/tests/
