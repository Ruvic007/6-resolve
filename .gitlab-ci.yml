pylint:
  stage: test
  image: python:latest
  before_script:
    - mkdir -p public/badges public/lint
    - echo undefined > public/badges/$CI_JOB_NAME.score
    - pip3 install anybadge pylint
    - pip3 install -r backend/requirements.txt  
    - git clone https://gitlab.esiea.fr/gauthier.heiss/python-file-scorer.git /opt/python-file-scorer
    - apt update
    - apt install bc -y
  script:
    # Le script va chercher récursivement dans backend/
    - /opt/python-file-scorer/score.sh | tee public/lint/lint.txt
    - tail -n 1 public/lint/lint.txt > public/badges/$CI_JOB_NAME.score
  after_script:
    # On génère le badge directement à la racine pour simplifier
    - anybadge --overwrite --label $CI_JOB_NAME --value=$(cat public/badges/$CI_JOB_NAME.score) --file=pylint.svg 4=red 6=orange 8=yellow 10=green
  artifacts:
    paths:
      - public
      - pylint.svg
    when: always